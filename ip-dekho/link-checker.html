<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is This Link Safe? - Fraud Link Checker India</title>
<style>
body{font-family:Inter; background:#f5f5f7; margin:0;}
.container{max-width:750px; margin:20px auto; padding:15px;}
.card{background:#fff; border-radius:20px; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,0.06);}
input{width:100%; padding:16px; border-radius:12px; border:2px solid #e5e5e5; font-size:16px; box-sizing:border-box;}
.btn{width:100%; padding:16px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:700; margin-top:12px; cursor:pointer;}
.result{margin-top:20px; padding:20px; border-radius:12px; display:none;}
.safe{background:#eaffea; border:2px solid #22c55e;}.danger{background:#ffeaea; border:2px solid #ef4444;}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>🔍 Is This Link Safe?</h1>
<p style="color:#666;">Paste any link from WhatsApp / Telegram / Instagram</p>
<input id="link" placeholder="https://..." />
<button class="btn" onclick="check()">Check Link Safety</button>
<div id="out" class="result"></div>
</div></div>
<script>
function check(){
  const url=document.getElementById('link').value.toLowerCase();
  const out=document.getElementById('out');
  if(!url){alert('Paste link');return;}
  out.style.display='block'; out.innerHTML='🤖 Checking domain, brand, virus database...';
  setTimeout(()=>{
    let score=0; let reasons=[];
    if(url.includes('sbi')||url.includes('flipkart')||url.includes('amazon')){if(!url.includes('sbi.co.in')&&!url.includes('flipkart.com')&&!url.includes('amazon.in')){score+=60; reasons.push('Fake brand domain');}}
    if(url.length>75){score+=20; reasons.push('URL too long (scam pattern)');}
    if(url.includes('bit.ly')||url.includes('tinyurl')){score+=30; reasons.push('Shortened suspicious link');}
    if(url.includes('free')||url.includes('lottery')||url.includes('offer')){score+=40; reasons.push('Contains offer/lottery bait');}
    if(score>=50){
      out.className='result danger';
      out.innerHTML=`<h3 style="color:red;">⚠️ SCAM LINK - Risk ${score}/100</h3><p>Reason: ${reasons.join(', ')}</p><p>Do NOT open. Block this number.</p>`;
    }else{
      out.className='result safe';
      out.innerHTML=`<h3 style="color:green;">✅ Looks Safe - Risk ${score}/100</h3><p>No scam pattern found. Still check official site.</p>`;
    }
  },1200);
}
</script>
</body>
</html>
