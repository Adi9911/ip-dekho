<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scam Message Checker - Free Fraud Detector India</title>
<style>
body{font-family:Inter, system-ui; background:#f5f5f7; margin:0;}
.container{max-width:750px; margin:20px auto; padding:15px;}
.card{background:#fff; border-radius:20px; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,0.06);}
textarea{width:100%; min-height:140px; padding:16px; border-radius:12px; border:2px solid #e5e5e5; font-size:16px; box-sizing:border-box;}
.btn{width:100%; padding:16px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; margin-top:12px;}
.btn2{padding:10px 14px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:14px; margin:5px;}
.result{margin-top:20px; padding:20px; border-radius:12px; display:none;}
.safe{background:#eaffea; border:2px solid #22c55e;}.danger{background:#ffeaea; border:2px solid #ef4444;}.warn{background:#fff8e1; border:2px solid #f59e0b;}
.badge{padding:6px 12px; border-radius:20px; font-size:12px; font-weight:800; color:#fff;}
.meter{width:100%; height:12px; background:#eee; border-radius:10px; margin:10px 0; overflow:hidden;}
.meter-fill{height:100%; border-radius:10px;}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>🛡️ AI Scam Message Checker</h1>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;">
<button class="btn2" onclick="setEx('sbi')">SBI KYC Scam</button>
<button class="btn2" onclick="setEx('lottery')">Lottery Scam</button>
<button class="btn2" onclick="setEx('job')">Job Scam</button>
</div>
<textarea id="msg" placeholder="Paste suspicious message here..."></textarea>
<button class="btn" onclick="analyze()">Check Now - AI Scan</button>
<div id="out" class="result"></div>
<div id="actions" style="display:none; gap:8px; margin-top:10px;">
<button class="btn2" onclick="copyR()">📋 Copy</button>
<button class="btn2" onclick="shareWA()">📤 Share</button>
<button class="btn2" onclick="speak()">🔊 Speak</button>
</div>
</div></div>
<script>
let last='';
const ex={sbi:'Your SBI account will be blocked today. Update KYC: http://sbi-kyc-update.com',lottery:'Congratulations! You won Rs 25,00,000 lottery. Claim now: http://lottery-claim-india.xyz',job:'Work from home! Earn 5000 daily. Pay Rs 500: http://job4u-online.com'};
function setEx(t){document.getElementById('msg').value=ex[t];}
function analyze(){
  const text=document.getElementById('msg').value.toLowerCase();
  const out=document.getElementById('out');
  if(!text){alert('Paste message');return;}
  out.style.display='block'; out.innerHTML='🤖 Analyzing...';
  setTimeout(()=>{
    let score=0,reasons=[],type='Safe';
    const rules=[
      {k:['account blocked','kyc update'],s:40,t:'Bank KYC Scam',r:'Bank never asks KYC via link'},
      {k:['lottery','won','prize'],s:50,t:'Lottery Scam',r:'Lottery wins are 99% fake'},
      {k:['job offer','earn 5000','registration'],s:35,t:'Job Scam',r:'Takes registration fees'},
      {k:['electricity','bijli','connection cut'],s:45,t:'Electricity Scam',r:'Trending bill scam'},
      {k:['bit.ly','tinyurl','http://'],s:25,t:'Suspicious Link',r:'Short suspicious link'},
      {k:['otp','share otp'],s:40,t:'OTP Fraud',r:'OTP asking is always scam'}
    ];
    rules.forEach(r=>{if(r.k.some(w=>text.includes(w))){score+=r.s;reasons.push(r.r);type=r.t;}});
    if(score>95)score=95;
    let color=score>=50?'#ef4444':score>=25?'#f59e0b':'#22c55e';
    let status=score>=50?'SCAM':score>=25?'SUSPICIOUS':'SAFE';
    let css=score>=50?'danger':score>=25?'warn':'safe';
    out.className='result '+css;
    out.innerHTML=`<span class="badge" style="background:${color}">${type} - ${status}</span><div class="meter"><div class="meter-fill" style="width:${score}%; background:${color}"></div></div><p><b>Risk ${score}/100</b><br>Reason: ${reasons.join(', ')||'No pattern'}<br>Advice: ${score>=50?'Delete. Do not click.':'Safe but verify.'}</p>`;
    last=`${status} - ${type} Risk ${score}/100 - ${reasons.join(', ')}`;
    document.getElementById('actions').style.display='flex';
  },1000);
}
function copyR(){navigator.clipboard.writeText(last); alert('Copied');}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(last+' Checked on ip-dekho.vercel.app'));}
function speak(){speechSynthesis.speak(new SpeechSynthesisUtterance(last));}
</script>
</body>
</html>
