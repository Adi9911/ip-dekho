<script>
let last='';
const ex={
  sbi:'SBI Alert: Your account KYC is pending, will be BLOCKED today. Update immediately: http://sbi-kyc-update.com.verify-login.gq',
  lottery:'Congratulations! You have won Rs 25,00,000 KBC lottery. Claim prize now: bit.ly/kbc-winner2025',
  job:'Work from home job! Earn Rs 5000 daily. Pay Rs 500 registration fees: http://job4u-online.com',
  electric:'Dear Consumer, your electricity connection will be CUT tonight at 9 PM due to unpaid bill. Pay immediately: https://bijli-bill-pay.xyz'
};
function setEx(t){document.getElementById('msg').value=ex[t];}

function analyze(){
  const raw=document.getElementById('msg').value;
  const text=raw.toLowerCase();
  const out=document.getElementById('out');
  if(!text){alert('Paste message first');return;}
  out.style.display='block'; out.innerHTML='🤖 Deep scanning 12 fraud patterns...';

  setTimeout(()=>{
    let score=0, reasons=[], type='Safe Message', tags=[];

    // 1. Urgency + Threat Language (Most powerful signal)
    if(/(blocked|will be blocked|suspended|cut tonight|immediately|urgent|last chance|today only)/.test(text)){
      score+=35; reasons.push('Creates panic & urgency (account blocked/cut tonight) - Real banks never threaten like this'); tags.push('Urgency Threat');
    }
    // 2. Suspicious TLD & Fake Domain
    if(/(\.gq|\.tk|\.xyz|\.online|\.link|\.top|verify-login|kyc-update|sbi-online|ebill-pay)/.test(text)){
      score+=40; reasons.push('Fake domain detected (.gq/.xyz or brand name + hyphen like sbi-kyc-update) - Real domain is sbi.co.in, not sbi-kyc-update.com'); type='Fake Link Scam';
    }
    // 3. Shortened Link
    if(/(bit\.ly|tinyurl|cutt\.ly|shorturl|rb\.gy)/.test(text)){
      score+=25; reasons.push('Uses URL shortener to hide real malicious link'); tags.push('Hidden Link');
    }
    // 4. Prize/Lottery - 72% people fall for this
    if(/(congratulations|won.*lottery|you won|prize|rs.*lakh|kbc winner)/.test(text)){
      score+=50; reasons.push('Prize/Lottery trap - 72% Indians get scammed by "You won prize" message'); type='Lottery / Prize Scam';
    }
    // 5. Bank KYC Scam - 52% cases
    if(/(sbi|kyc.*pending|kyc.*update|bank.*blocked|hdfc|icici|pancard update)/.test(text)){
      score+=45; reasons.push('Bank KYC scam - Banks NEVER ask KYC via SMS link. Always check via official app'); type='Bank KYC Scam';
    }
    // 6. Electricity Bill Scam - Trending in India 2024-25
    if(/(electricity|bijli|power cut|connection cut|bill.*unpaid|bescom|mseb)/.test(text)){
      score+=45; reasons.push('Trending Electricity Bill scam in India - Distribution companies never cut at night via SMS'); type='Electricity Bill Scam';
    }
    // 7. Job + Registration Fee
    if(/(work from home|earn \d+ daily|registration fee|pay.*to get job|part time job)/.test(text)){
      score+=40; reasons.push('Job scam - Asks for registration fee, no real company takes money to give job'); type='Job Scam';
    }
    // 8. OTP / Personal Info Asking
    if(/(share otp|send otp|aadhaar.*share|send.*cvv|pin.*share)/.test(text)){
      score+=60; reasons.push('Asks for OTP/Aadhaar/CVV - 100% fraud. No company asks this'); type='OTP / Identity Theft';
    }
    // 9. Delivery Scam
    if(/(package.*pending|delivery.*failed|update.*address|fedex.*track|dhl.*pending)/.test(text)){
      score+=35; reasons.push('Fake delivery notification - Real courier never asks to pay via link'); type='Delivery Scam';
    }
    // 10. Generic + HTTP (not HTTPS)
    if(/(http:\/\/)/.test(text) &&!/(https)/.test(text)){
      score+=15; reasons.push('Uses insecure http:// link, not https://'); tags.push('Insecure Link');
    }

    if(score>99) score=99;
    let color = score>=65? '#ef4444' : score>=30? '#f59e0b' : '#22c55e';
    let status = score>=65? '🔴 SCAM CONFIRMED' : score>=30? '🟡 SUSPICIOUS - VERIFY' : '🟢 LIKELY SAFE';
    let css = score>=65? 'danger' : score>=30? 'warn' : 'safe';

    let advice = score>=65? '❌ DELETE immediately. Do NOT click. Block number. Report on 1930 cybercrime helpline.' : score>=30? '⚠️ Do NOT click link. Open official SBI/Bijli app to verify. If in doubt, call official customer care.' : '✅ No strong scam pattern found, but still verify link by hovering before clicking. If from unknown number, be careful.';

    out.className='result '+css;
    out.innerHTML=`
      <span class="badge" style="background:${color}">${type} - ${status}</span>
      <div class="meter"><div class="meter-fill" style="width:${score}%; background:${color}; transition:1s"></div></div>
      <p style="margin:8px 0;"><b>Risk Score: ${score}/100</b> ${tags.map(t=>`<span style="font-size:11px;background:#000;color:#fff;padding:3px 7px;border-radius:10px;margin-left:5px;">${t}</span>`).join('')}</p>
      <div style="background:#fff;padding:12px;border-radius:10px;margin:10px 0;">
        <b>🔍 Why we flagged this:</b>
        <ul style="margin:8px 0;padding-left:18px;font-size:14px;">${reasons.length?reasons.map(r=>`<li>${r}</li>`).join(''):`<li>No fraud pattern matched. Looks like normal message.</li>`}</ul>
      </div>
      <p style="font-size:14px;"><b>🛡️ What to do:</b> ${advice}</p>
      <p style="font-size:11px;color:#888;margin-top:10px;">Checked via AI pattern matching (12 fraud signals) - Not 100% guarantee, always verify from official app.</p>
    `;
    last=`${status} - ${type} Risk ${score}/100 - Reason: ${reasons.join('; ')} - Check: ip-dekho.vercel.app/ai-scam-checker.html`;
    document.getElementById('actions').style.display='flex';
  },700);
}
function copyR(){navigator.clipboard.writeText(last); alert('Copied!');}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(last));}
function speak(){speechSynthesis.speak(new SpeechSynthesisUtterance(last));}
</script>
